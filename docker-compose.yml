services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_OUTSIDE_PORT},CONTROLLER://localhost:9093,INNER://0.0.0.0:${KAFKA_INNER_PORT}
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_OUTSIDE_PORT},INNER://kafka:${KAFKA_INNER_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INNER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1

    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:${KAFKA_OUTSIDE_PORT} --list
      interval: 15s
      timeout: 15s
      retries: 5
      start_period: 30s

    ports:
      - ${KAFKA_OUTSIDE_PORT}:${KAFKA_OUTSIDE_PORT}

  ingestion_service:
    build:
      context: ./IngestionService
      dockerfile: Dockerfile
    env_file:
      - ./env/.env.stations_api
      - ./env/.env.kafka
      - ./env/.env.ingestion_configs
    environment:
      - KafkaConnectionConfiguration__KafkaBootStrapServes=kafka:${KAFKA_INNER_PORT}
      
    container_name: ingestion_service
    depends_on:
      kafka:
        condition: service_healthy